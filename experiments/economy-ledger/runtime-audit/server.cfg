// server.cfg — loss-counter audit local server (run with +exec server.cfg)
// NOTE: startmoney 0 + maxmoney 65535 — every award must be observable;
// 16000/16000 would cap loss-bonus payouts at the cash cap and corrupt the
// matrix. Each matrix cell MUST start with `mp_restartgame 1` (full reset:
// money + loss counters) so cells never contaminate each other.
sv_cheats 1
mp_freezetime 15
mp_buytime 20
mp_startmoney 0
mp_maxmoney 65535
mp_buy_anywhere 1
mp_starting_losses 1
mp_consecutive_loss_aversion 1
mp_consecutive_loss_max 4
mp_halftime 0
mp_overtime_enable 0
mp_match_can_clinch 0
mp_playercashawards 1
mp_teamcashawards 1
mp_roundtime 5
mp_roundtime_defuse 5
mp_maxrounds 60
mp_afterroundmoney 0
mp_autoteambalance 0
mp_limitteams 0
bot_quota 0
mp_warmup_end
game_type 0
game_mode 1
