// GSI config — copy to <cs2>/game/csgo/cfg/gamestate_integration_roundsense_lossbonus.cfg
// (BEFORE launching the game; GSI cfgs are read at game startup. A running
// game must be restarted after copying. The console command
// `game_state_integration <file>` is NOT confirmed on the current build —
// do not rely on it; verify with `find gamestate_integration` first.)
