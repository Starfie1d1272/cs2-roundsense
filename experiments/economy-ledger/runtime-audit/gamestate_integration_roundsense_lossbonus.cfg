{
    "uri" "http://127.0.0.1:1337"
    "timeout" "5.0"
    "buffer" 0.1
    "throttle" 0.0
    "heartbeat" 10.0
    "data"
    {
        "provider" "1"
        "map" "1"
        "round" "1"
        "player_id" "1"
        "player_state" "1"
        "player_weapons" "1"
        "player_match_stats" "1"
        "allplayers_id" "1"
        "allplayers_state" "1"
        "allplayers_match_stats" "1"
        "allplayers_weapons" "1"
        "allplayers_position" "0"
        "phase_countdowns" "1"
    }
}
