// client-auto.cfg — attach after the server is up (bind as needed)
// record the whole session:
//   record buytest
// then execute one matrix cell, e.g. initial state 2 → bomb_defused win:
//   exec cell_state2_bombdefused.cfg
// Matrix cells (win exactly once, then lose once — see README):
//   initialState 1: lose r1 (do nothing as T or CT)
//   initialState 2: lose r1, r2
//   initialState 3: lose r1..r3
//   initialState 4: lose r1..r4 (payout stays 3400 — cap)
// win reasons:
//   elimination: kill all 5 opponents
//   time_ran_out: as T, never plant; timer expires (CT win)
//   bomb_defused: as T plant; as CT defuse (after losing the plant round)
//   target_bombed: as T plant and let it explode
// then lose the NEXT round (do nothing) — record payout from demo/GSI.
