name: ci

on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read


jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # version comes from package.json "packageManager" (pnpm@11.20.0) —
      # do NOT pin a version here or the action errors on a mismatch
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # validator smoke: repo-only tiny fixture (no large corpus in git);
      # path is relative to the tools package cwd under pnpm --filter
      - run: pnpm --filter @roundsense/tools validate -- ../fixtures/demo-format/tiny-v3.zip
