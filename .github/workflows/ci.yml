name: ci

on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read


jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # version comes from package.json "packageManager" (pnpm@12.9.1) —
      # do NOT pin a version here or the action errors on a mismatch
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # validator smoke: repo-only tiny fixture (no large corpus in git);
      # path is relative to the tools package cwd under pnpm --filter
      - run: pnpm --filter @roundsense/tools validate -- ../fixtures/demo-format/tiny-v3.zip

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @roundsense/desktop build:sidecar
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo build --release --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm --filter @roundsense/desktop package:win
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RoundSense-win64-portable
          path: apps/desktop/dist/RoundSense-win64-portable.zip
          retention-days: 14
