name: ci

on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read


jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # version comes from package.json "packageManager" (pnpm@11.20.0) —
      # do NOT pin a version here or the action errors on a mismatch
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # validator smoke: repo-only tiny fixture (no large corpus in git);
      # path is relative to the tools package cwd under pnpm --filter
      - run: pnpm --filter @roundsense/tools validate -- ../fixtures/demo-format/tiny-v3.zip

  package-windows-alpha:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:win
      - uses: actions/upload-artifact@v4
        with:
          name: roundsense-product-alpha-windows-x64
          path: apps/desktop/release/*.zip
          if-no-files-found: error
