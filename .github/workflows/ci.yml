name: ci

on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read


jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # version comes from package.json "packageManager" (pnpm@12.9.1) —
      # do NOT pin a version here or the action errors on a mismatch
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # validator smoke: repo-only tiny fixture (no large corpus in git);
      # path is relative to the tools package cwd under pnpm --filter
      - run: pnpm --filter @roundsense/tools validate -- ../fixtures/demo-format/tiny-v3.zip

  windows-hud:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: powershell -ExecutionPolicy Bypass -File scripts/windows/gsi-config.test.ps1
      - run: pnpm desktop:build
