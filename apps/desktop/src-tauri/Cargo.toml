[package]
name = "roundsense-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "RoundSense non-interactive Windows freeze-time HUD host"

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
